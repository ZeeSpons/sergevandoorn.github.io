<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Serge van Doorn</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <!-- Open Graph tags -->
<meta property="og:title" content="Serge van Doorn">
<meta property="og:description" content="Contact">
<meta property="og:image" content="https://www.sergevandoorn.nl/assets/contact.png">
<meta property="og:url" content="https://www.sergevandoorn.nl/contact">
<meta property="og:url" content="sergevandoorn.nl/contact">

<meta name="twitter:card" content="summary_large_image">

</head>

  <body>
  
    <a class="copy-mail"> contact@sergevandoorn.nl </a>
    
    </body>
    
    
    <script>
    document.querySelectorAll('.copy-mail').forEach(element => {
  element.addEventListener('click', function() {
    const textToCopy = this.innerText;

    navigator.clipboard.writeText(textToCopy).then(() => {
      // Optioneel: geef visuele feedback
      this.classList.add('copy-success');
      
      // Verwijder de melding na 2 seconden
      setTimeout(() => {
        this.classList.remove('copy-success');
      }, 2000);
    }).catch(err => {
      console.error('Fout bij kopiëren: ', err);
    });
  });
});
</script>
</html>
