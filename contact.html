<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Serge van Doorn</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <!-- Open Graph tags -->
<meta property="og:title" content="Serge van Doorn">
<meta property="og:description" content="Contact">
<meta property="og:image" content="https://www.sergevandoorn.nl/assets/contact.png">
<meta property="og:url" content="https://www.sergevandoorn.nl/contact">
<meta property="og:url" content="sergevandoorn.nl/contact">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">


<style>

  body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #e0e1da;
  }

.copy-mail {
  cursor: pointer;
  font-size: 2rem;
  transition: color 0.2s;

}

.copy-mail:hover {
  color: #ff4d4d; /* Kleur verandert bij hover */
  text-decoration: underline;
  font-size: 2.1rem;
}

/* Optioneel: een kleine melding als het gekopieerd is */
.copy-success::after {
  content: "Gekopieerd!";
  font-size: 1rem;
  color: darkgray;
}

</style>

<head>


  <body>
  
    <a class="copy-mail"> contact@sergevandoorn.nl </a>
    
    </body>
    
    
    
    <script>
    document.querySelectorAll('.copy-mail').forEach(element => {
  element.addEventListener('click', function() {
    const textToCopy = this.innerText;

    navigator.clipboard.writeText(textToCopy).then(() => {
      // Optioneel: geef visuele feedback
      this.classList.add('copy-success');
      
      // Verwijder de melding na 2 seconden
      setTimeout(() => {
        this.classList.remove('copy-success');
      }, 2000);
    }).catch(err => {
      console.error('Fout bij kopiëren: ', err);
    });
  });
});
</script>


    
</html>
